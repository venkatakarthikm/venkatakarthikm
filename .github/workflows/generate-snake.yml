name: Generate Snake Animation

on:
  schedule:
    # Refreshes the contribution data every 12 hours. The animation itself
    # loops infinitely on its own — this schedule just keeps the squares
    # it "eats" up to date with your latest commits.
    - cron: "0 */12 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVG/GIF
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: venkatakarthikm
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-snake.gif?color_snake=orange&color_dots=#bfd6f6,#8dbdff,#64a1f4,#4b91f1,#3182ce

      - name: Push output to the "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
